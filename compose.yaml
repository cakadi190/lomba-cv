name: lombacv

x-app-common: &app-common
  image: lombacv:latest
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  # Redis and Mailpit still run on the host and are reached via
  # host.docker.internal (Mongo instead uses mongo-net's fixed gateway IP
  # directly — see MONGODB_URL in .env.example).
  extra_hosts:
    - "host.docker.internal:host-gateway"
  env_file:
    - .env
  environment:
    NODE_ENV: production
    HOST: "0.0.0.0"
    PORT: 3000
    # Nitro only overrides runtimeConfig.public.baseUrl at runtime via this
    # exact name (NUXT_PUBLIC_BASE_URL) — it does not re-read APP_URL from
    # nuxt.config.ts after build, since that's only evaluated at build time
    # (see Dockerfile's build stage). Derived from APP_URL (set in .env) so
    # only one variable needs updating per environment.
    NUXT_PUBLIC_BASE_URL: ${APP_URL}
  # Host has only ~1.88GB RAM total, shared with vettrak's containers and a
  # native mongod (~200MB). Blue/green briefly runs both colors of BOTH apps
  # at once during a flip, so caps here need headroom for 4 app containers +
  # mongod without OOM-killing anything. 320MB fits real usage (~291MB RSS
  # observed for this Nitro process) with a little room to grow.
  mem_limit: 320m
  mem_reservation: 192m
  healthcheck:
    test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 10s
    timeout: 5s
    retries: 5

networks:
  # Docker won't allow a fixed ipv4_address on the literal default "bridge"
  # network (only user-defined networks support that), so lomba-cv gets its
  # own user-defined bridge network. Create it once on the host before the
  # first deploy:
  #   docker network create lombacv-net --subnet 172.21.0.0/16
  # vettrak gets its own separate network (vettrak-net, 172.18.0.0/16) — see
  # vettrak/docs/mongodb-native-setup.md for how mongod trusts both gateways.
  default:
    name: lombacv-net
    external: true
  # A single native mongod serves both lomba-cv and vettrak, but a replica
  # set (required for transactions) can only advertise ONE host for its
  # member — a per-app bridge gateway (172.21.0.1 here) isn't reachable from
  # the other app's isolated bridge. mongo-net is attached to both apps'
  # containers so there's one gateway (172.20.0.1) both can actually reach.
  # This is the host's pre-existing "mongo-net" network (172.20.0.0/24,
  # gateway 172.20.0.1) — reused as-is rather than creating a new network
  # with an overlapping subnet (Docker refuses overlapping pools).
  mongo-net:
    name: mongo-net
    external: true

services:
  # Blue/Green deployment: only one color is up in production at a time, but
  # both are briefly up together during a flip (new one health-checked before
  # the old one stops) — so each color needs its OWN fixed IP, not a shared one.
  # scripts/deploy-bluegreen.sh toggles which profile is active and flips
  # the Nginx upstream to point at it. Prefixed lombacv-* (vettrak uses
  # vettrak-*) so containers/images from both apps are easy to tell apart.
  lombacv-blue:
    <<: *app-common
    container_name: lombacv-blue
    profiles: ["blue"]
    networks:
      default:
        ipv4_address: 172.21.0.5
      mongo-net: {}
    ports:
      - "127.0.0.1:5010:3000"

  lombacv-green:
    <<: *app-common
    container_name: lombacv-green
    profiles: ["green"]
    networks:
      default:
        ipv4_address: 172.21.0.8
      mongo-net: {}
    ports:
      - "127.0.0.1:5011:3000"
