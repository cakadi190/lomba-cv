name: lombacv

x-app-common: &app-common
  image: lombacv:latest
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  # Redis and Mailpit still run on the host and are reached via
  # host.docker.internal (Mongo instead uses the fixed 172.17.0.1 gateway
  # IP directly — see MONGODB_URL in .env.example).
  extra_hosts:
    - "host.docker.internal:host-gateway"
  env_file:
    - .env
  environment:
    NODE_ENV: production
    HOST: "0.0.0.0"
    PORT: 3000
  healthcheck:
    test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 10s
    timeout: 5s
    retries: 5

networks:
  # Docker's own default "bridge" network (172.17.0.0/16 on the production
  # host), shared with vettrak's compose project, so both apps get fixed,
  # predictable IPs that mongod's bindIp already trusts (see
  # vettrak/docs/mongodb-native-setup.md) instead of routing through
  # host.docker.internal. Declared external since it already exists.
  default:
    name: bridge
    external: true

services:
  # Blue/Green deployment: only one color is up in production at a time, but
  # both are briefly up together during a flip (new one health-checked before
  # the old one stops) — so each color needs its OWN fixed IP, not a shared one.
  # scripts/deploy-bluegreen.sh toggles which profile is active and flips
  # the Nginx upstream to point at it. Prefixed lombacv-* (vettrak uses
  # vettrak-*) so containers/images from both apps are easy to tell apart.
  lombacv-blue:
    <<: *app-common
    container_name: lombacv-blue
    profiles: ["blue"]
    networks:
      default:
        ipv4_address: 172.17.0.5
    ports:
      - "127.0.0.1:5010:3000"

  lombacv-green:
    <<: *app-common
    container_name: lombacv-green
    profiles: ["green"]
    networks:
      default:
        ipv4_address: 172.17.0.8
    ports:
      - "127.0.0.1:5011:3000"
