name: lombacv

x-app-common: &app-common
  image: lombacv:latest
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  # MongoDB and Redis run on the host, not in Docker. `host-gateway`
  # resolves to the host's address on the bridge.
  extra_hosts:
    - "host.docker.internal:host-gateway"
  env_file:
    - .env
  environment:
    NODE_ENV: production
    HOST: "0.0.0.0"
    PORT: 3000
  healthcheck:
    test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 10s
    timeout: 5s
    retries: 5

services:
  # Blue/Green deployment: only one color is up in production at a time.
  # scripts/deploy-bluegreen.sh toggles which profile is active and flips
  # the Nginx upstream to point at it. Prefixed lombacv-* (vettrak uses
  # vettrak-*) so containers/images from both apps are easy to tell apart.
  lombacv-blue:
    <<: *app-common
    container_name: lombacv-blue
    profiles: ["blue"]
    ports:
      - "127.0.0.1:5010:3000"

  lombacv-green:
    <<: *app-common
    container_name: lombacv-green
    profiles: ["green"]
    ports:
      - "127.0.0.1:5011:3000"
